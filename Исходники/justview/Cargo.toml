[package]
name = "justview"
version = "1.3.2"
edition = "2024"
description = "JustView — ультрабыстрый просмотрщик фото, видео и любых файлов"
authors = ["JustView"]
build = "build.rs"

[[bin]]
name = "JustView"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.37", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "rayon"] }
resvg = "0.50"
kamadak-exif = "0.6"
cpal = "0.18"
arboard = { version = "3.7", default-features = false, features = ["windows-sys", "image-data"] }
rfd = "0.18"
winreg = "0.56"
bytemuck = "1"
serde_json = "1"
raw-window-handle = "0.6"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
